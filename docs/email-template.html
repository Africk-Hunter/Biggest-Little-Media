<!--
  EmailJS template for the Contact page form.
  Paste this into EmailJS: Email Templates > your template > Content tab > "Code Editor" (</> icon).
  Variables used: {{name}} {{email}} {{phone}} {{notes}}
  Suggested Subject line (set in the Settings tab, not here): New inquiry from {{name}}
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#1a1815;padding:40px 20px;font-family:'Work Sans',Arial,sans-serif;">
  <tr>
    <td align="center">
      <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="max-width:480px;width:100%;background-color:#252220;border-radius:12px;overflow:hidden;">

        <!-- Header -->
        <tr>
          <td style="padding:32px 32px 20px;border-bottom:1px solid #3a352f;">
            <span style="font-family:'Oswald',Arial,sans-serif;font-weight:700;font-size:13px;letter-spacing:0.14em;text-transform:uppercase;color:#c8b89a;">
              Biggest Little Media
            </span>
            <h1 style="margin:10px 0 0;font-family:'Oswald',Arial,sans-serif;font-weight:700;font-size:24px;letter-spacing:-0.01em;text-transform:uppercase;color:#f0e8d8;">
              New Contact Inquiry
            </h1>
          </td>
        </tr>

        <!-- Details -->
        <tr>
          <td style="padding:28px 32px 8px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
              <tr>
                <td style="padding-bottom:16px;">
                  <span style="display:block;font-family:'Oswald',Arial,sans-serif;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:#706860;">Name</span>
                  <span style="display:block;margin-top:4px;font-size:15px;color:#f0e8d8;">{{name}}</span>
                </td>
              </tr>
              <tr>
                <td style="padding-bottom:16px;">
                  <span style="display:block;font-family:'Oswald',Arial,sans-serif;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:#706860;">Email</span>
                  <a href="mailto:{{email}}" style="display:block;margin-top:4px;font-size:15px;color:#c8b89a;text-decoration:none;">{{email}}</a>
                </td>
              </tr>
              <tr>
                <td style="padding-bottom:16px;">
                  <span style="display:block;font-family:'Oswald',Arial,sans-serif;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:#706860;">Phone</span>
                  <span style="display:block;margin-top:4px;font-size:15px;color:#f0e8d8;">{{phone}}</span>
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- Notes -->
        <tr>
          <td style="padding:8px 32px 32px;">
            <span style="display:block;font-family:'Oswald',Arial,sans-serif;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:#706860;margin-bottom:8px;">Notes</span>
            <div style="background-color:#1a1815;border-radius:8px;padding:16px 18px;font-size:14px;line-height:1.6;color:#f0e8d8;white-space:pre-wrap;">{{notes}}</div>
          </td>
        </tr>

        <!-- Footer -->
        <tr>
          <td style="padding:20px 32px;border-top:1px solid #3a352f;">
            <span style="font-size:12px;color:#706860;">Sent from the contact form at biggestlittlemedia.com</span>
          </td>
        </tr>

      </table>
    </td>
  </tr>
</table>
